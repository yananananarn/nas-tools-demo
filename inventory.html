<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>備品一覧</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#203048;font:16px/1.65 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:28px 22px}h1{font-size:28px;line-height:1.3;margin:10px 0 18px}h2{font-size:18px}p{color:#58677a}.tag{font-size:12px;letter-spacing:.13em;color:#087f85;font-weight:700}.card{background:white;border:1px solid #dfe6ee;border-radius:16px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.grid .card{margin:0}label{display:block;margin:12px 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #c5d0de;border-radius:9px;padding:10px;background:white}button{border:0;border-radius:9px;padding:10px 16px;background:#087f85;color:white;cursor:pointer}output{display:block;font-size:28px;font-weight:700;color:#087f85;margin-top:16px}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}.scroll{overflow:auto}.muted{font-size:13px;color:#637187}a{color:#087f85}</style></head><body><main><div class="tag">DUMMY TOOL / 03</div><h1>備品一覧</h1><p>架空の備品データです。名称・管理番号・状態で絞り込めます。</p><div class="card"><label for="search">検索</label><input id="search" type="search" placeholder="例：PC、貸出中"><p id="count" class="muted" aria-live="polite">5 件表示</p><div class="scroll"><table><thead><tr><th>管理番号</th><th>名称</th><th>状態</th></tr></thead><tbody><tr><td>PC-001</td><td>ノートPC</td><td>貸出中</td></tr><tr><td>PC-002</td><td>ノートPC</td><td>利用可能</td></tr><tr><td>MON-001</td><td>液晶モニター</td><td>利用可能</td></tr><tr><td>HUB-001</td><td>USBハブ</td><td>貸出中</td></tr><tr><td>PRJ-001</td><td>プロジェクター</td><td>点検中</td></tr></tbody></table></div><p class="muted">表が横に収まらない場合は、表の部分を横にスクロールできます。</p></div></main><script>const rows=Array.from(document.querySelectorAll('tbody tr'));document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();let n=0;rows.forEach(r=>{r.hidden=!r.textContent.toLowerCase().includes(q);if(!r.hidden)n++;});document.getElementById('count').textContent=n+' 件表示';});</script></body></html>
