<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簡易計算</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#203048;font:16px/1.65 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:28px 22px}h1{font-size:28px;line-height:1.3;margin:10px 0 18px}h2{font-size:18px}p{color:#58677a}.tag{font-size:12px;letter-spacing:.13em;color:#087f85;font-weight:700}.card{background:white;border:1px solid #dfe6ee;border-radius:16px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.grid .card{margin:0}label{display:block;margin:12px 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #c5d0de;border-radius:9px;padding:10px;background:white}button{border:0;border-radius:9px;padding:10px 16px;background:#087f85;color:white;cursor:pointer}output{display:block;font-size:28px;font-weight:700;color:#087f85;margin-top:16px}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}.scroll{overflow:auto}.muted{font-size:13px;color:#637187}a{color:#087f85}</style></head><body><main><div class="tag">DUMMY TOOL / 01</div><h1>簡易計算</h1><p>単価 × 数量を計算するダミーツールです。</p><form class="card" id="form"><label for="price">単価（円）</label><input id="price" type="number" min="0" step="any" value="1200" required><label for="qty">数量</label><input id="qty" type="number" min="0" step="1" value="3" required><p><button type="submit">計算する</button></p><output id="result" aria-live="polite">3,600 円</output></form></main><script>document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const n=Number(document.getElementById('price').value)*Number(document.getElementById('qty').value);document.getElementById('result').textContent=n.toLocaleString('ja-JP')+' 円';});</script></body></html>
