<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字カウント</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#203048;font:16px/1.65 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:28px 22px}h1{font-size:28px;line-height:1.3;margin:10px 0 18px}h2{font-size:18px}p{color:#58677a}.tag{font-size:12px;letter-spacing:.13em;color:#087f85;font-weight:700}.card{background:white;border:1px solid #dfe6ee;border-radius:16px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.grid .card{margin:0}label{display:block;margin:12px 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #c5d0de;border-radius:9px;padding:10px;background:white}button{border:0;border-radius:9px;padding:10px 16px;background:#087f85;color:white;cursor:pointer}output{display:block;font-size:28px;font-weight:700;color:#087f85;margin-top:16px}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}.scroll{overflow:auto}.muted{font-size:13px;color:#637187}a{color:#087f85}</style></head><body><main><div class="tag">DUMMY TOOL / 02</div><h1>文字カウント</h1><p>入力に合わせて、文字数と行数が変わります。</p><div class="card"><label for="text">確認したい文章</label><textarea id="text" rows="7" placeholder="ここに文字を入力してください"></textarea><output id="result" aria-live="polite">0 文字 / 0 行</output><p class="muted">文字数は空白を含み、改行を除きます。Unicodeのコードポイント単位で数えます。</p><button id="clear" type="button">クリア</button></div></main><script>const t=document.getElementById('text');function count(){document.getElementById('result').textContent=Array.from(t.value.replace(/\r?\n/g,'')).length+' 文字 / '+(t.value?t.value.split('\n').length:0)+' 行';}t.addEventListener('input',count);document.getElementById('clear').onclick=()=>{t.value='';count();t.focus();};</script></body></html>
