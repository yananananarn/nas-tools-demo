<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NASツールポータル | デモ</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:15px system-ui,sans-serif;color:#203048;background:#f5f7fb}.layout{height:100vh;height:100dvh;display:grid;grid-template-columns:256px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr)}header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:white;border-bottom:1px solid #dfe6ee;z-index:30}.toggle{font:inherit;border:1px solid #d8e1eb;border-radius:9px;background:white;padding:7px 12px;cursor:pointer;color:#203048}#current{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#5b6c80}.brand{font-weight:750;letter-spacing:.03em}.badge{margin-left:auto;font-size:11px;color:#087f85;background:#e6f5f3;border-radius:20px;padding:4px 9px}aside{grid-row:2;background:#102638;color:#fff;padding:22px 14px;overflow:auto}aside .label{font-size:11px;letter-spacing:.14em;color:#8ba9bf;margin:4px 12px 16px}nav a{display:block;color:#d7e4ee;text-decoration:none;padding:13px 14px;margin:6px 0;border-radius:9px}nav a:hover{background:#213e51}nav a[aria-current="page"]{background:#0f8187;color:white}.sub{font-size:11px;display:block;opacity:.72;margin-top:4px}.foot{padding:22px 12px;color:#8ba9bf;font-size:12px;line-height:1.7}.view{grid-column:2;grid-row:2;min-width:0;min-height:0;display:flex;flex-direction:column}.bar{height:40px;flex-shrink:0;padding:10px 18px;font-size:12px;border-bottom:1px solid #e1e7ef;color:#5b6c80}iframe{width:100%;flex:1;min-height:0;border:0;background:#f5f7fb}.layout.closed{grid-template-columns:0 minmax(0,1fr)}.layout.closed aside{display:none}.shade{display:none}@media(max-width:700px){.layout,.layout.closed{grid-template-columns:0 minmax(0,1fr)}aside{position:fixed;top:60px;bottom:0;left:0;width:min(280px,85vw);z-index:25;box-shadow:8px 0 30px #0003}.shade{position:fixed;inset:60px 0 0;background:#071b3266;z-index:20}.layout:not(.closed) .shade{display:block}.brand{font-size:14px}.badge{font-size:10px}}</style></head><body><div class="layout closed" id="layout"><header><button class="toggle" id="toggle" aria-label="メニューを開閉" aria-controls="sidebar" aria-expanded="false">☰</button><span class="brand">NAS TOOL PORTAL</span><span id="current">ホーム</span></header><aside id="sidebar"><div class="label">TOOLS / MENU</div><nav aria-label="ツールメニュー"><a href="home.html" data-page="home" target="main" aria-current="page">ホーム<span class="sub">スタート画面</span></a><a href="calculator.html" data-page="calculator" target="main">簡易計算<span class="sub">単価 × 数量</span></a><a href="text.html" data-page="text" target="main">文字カウント<span class="sub">文字数・行数</span></a><a href="inventory.html" data-page="inventory" target="main">備品一覧<span class="sub">表・検索</span></a></nav><div class="foot">メニューから選ぶと<br>右側のページが切り替わります。</div></aside><div id="shade" class="shade"></div><section class="view"><iframe id="main" name="main" title="ホーム" src="home.html"></iframe></section></div><script>const layout=document.getElementById('layout'),toggle=document.getElementById('toggle'),frame=document.getElementById('main');const mobile=matchMedia('(max-width:700px)');function setOpen(open){layout.classList.toggle('closed',!open);toggle.setAttribute('aria-expanded',String(open));}setOpen(!mobile.matches);toggle.onclick=()=>setOpen(layout.classList.contains('closed'));document.getElementById('shade').onclick=()=>{setOpen(false);toggle.focus();};document.addEventListener('keydown',e=>{if(e.key==='Escape'){setOpen(false);toggle.focus();}});mobile.addEventListener('change',e=>setOpen(!e.matches));document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',e=>{ document.querySelectorAll('nav a').forEach(x=>x.removeAttribute('aria-current'));a.setAttribute('aria-current','page');document.getElementById('current').textContent=a.firstChild.textContent;frame.title=a.firstChild.textContent;if(mobile.matches){setOpen(false);toggle.focus();}}));</script></body></html>
